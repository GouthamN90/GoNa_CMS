spring.application.name=app

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Set the root logging level (TRACE, DEBUG, INFO, WARN, ERROR)
logging.level.root=INFO

# Set a custom log level for your application package
logging.level.com.example.demo=DEBUG

# Optional: Write logs to a file in addition to the console
logging.file.name=logs/spring-boot-app.log

# Optional: Customize console log output format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/naah_gona_db?useSSL=false&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# 'update' automatically creates or updates database tables based on your Java entities
spring.jpa.hibernate.ddl-auto=update
# Enters SQL statements in the console (great for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Force Tomcat to check for JSP updates on every request
server.servlet.jsp.init-parameters.development=true